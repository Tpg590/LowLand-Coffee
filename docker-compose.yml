services:
  # =========================================================================
  # 1. Database: Microsoft SQL Server 2022 (5 Databases Isolation)
  # =========================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lowland-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-YourPassword123!}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./database:/database
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U ${DB_USER:-sa} -P '${DB_PASSWORD:-YourPassword123!}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lowland-network

  # =========================================================================
  # 2. Database Auto-Init & Seeding (Tự động nạp schema & data mẫu cho 5 DB)
  # =========================================================================
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lowland-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo '---------------------------------------------------------'
        echo '>> [1/2] Creating 5 Databases & Tables from init scripts...'
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U ${DB_USER:-sa} -P '${DB_PASSWORD:-YourPassword123!}' -C -i /database/init_all_databases.sql
        echo '>> [2/2] Seeding initial mock data into 5 Databases...'
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U ${DB_USER:-sa} -P '${DB_PASSWORD:-YourPassword123!}' -C -i /database/seed_data.sql
        echo '>> Database initialization and data seeding COMPLETED!'
        echo '---------------------------------------------------------'
    volumes:
      - ./database:/database
    networks:
      - lowland-network

  # =========================================================================
  # 3. Backend Microservices (.NET 8 Web API - 4 Layers Standard)
  # =========================================================================
  auth-api:
    build:
      context: .
      dockerfile: src/backend/services/Auth.API/Dockerfile
    container_name: lowland-auth-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__AuthConnection=Server=${DB_SERVER:-sqlserver},1433;Database=Coffee_AuthDB;User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-YourPassword123!};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-LowLandCoffee_Super_Secret_Key_For_PRN232_Assignment_2026_Key}
      - JwtSettings__Issuer=${JWT_ISSUER:-LowLandCoffee.Auth}
      - JwtSettings__Audience=${JWT_AUDIENCE:-LowLandCoffee.Clients}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS:-24}
    ports:
      - "${AUTH_HOST_PORT:-5001}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - lowland-network

  product-api:
    build:
      context: .
      dockerfile: src/backend/services/Product.API/Dockerfile
    container_name: lowland-product-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__ProductConnection=Server=${DB_SERVER:-sqlserver},1433;Database=Coffee_ProductDB;User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-YourPassword123!};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-LowLandCoffee_Super_Secret_Key_For_PRN232_Assignment_2026_Key}
      - JwtSettings__Issuer=${JWT_ISSUER:-LowLandCoffee.Auth}
      - JwtSettings__Audience=${JWT_AUDIENCE:-LowLandCoffee.Clients}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS:-24}
    ports:
      - "${PRODUCT_HOST_PORT:-5002}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - lowland-network

  order-api:
    build:
      context: .
      dockerfile: src/backend/services/Order.API/Dockerfile
    container_name: lowland-order-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__OrderConnection=Server=${DB_SERVER:-sqlserver},1433;Database=Coffee_OrderDB;User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-YourPassword123!};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-LowLandCoffee_Super_Secret_Key_For_PRN232_Assignment_2026_Key}
      - JwtSettings__Issuer=${JWT_ISSUER:-LowLandCoffee.Auth}
      - JwtSettings__Audience=${JWT_AUDIENCE:-LowLandCoffee.Clients}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS:-24}
      - VnPay__TmnCode=${VNPAY_TMN_CODE:-}
      - VnPay__HashSecret=${VNPAY_HASH_SECRET:-}
      - VnPay__BaseUrl=${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      - VnPay__ReturnUrl=${VNPAY_RETURN_URL:-http://localhost:5000/api/payments/vnpay-return}
      - Services__ProductApiUrl=${PRODUCT_API_URL:-http://product-api:8080}
    ports:
      - "${ORDER_HOST_PORT:-5003}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - lowland-network

  engagement-api:
    build:
      context: .
      dockerfile: src/backend/services/Engagement.API/Dockerfile
    container_name: lowland-engagement-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__EngagementConnection=Server=${DB_SERVER:-sqlserver},1433;Database=Coffee_EngagementDB;User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-YourPassword123!};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-LowLandCoffee_Super_Secret_Key_For_PRN232_Assignment_2026_Key}
      - JwtSettings__Issuer=${JWT_ISSUER:-LowLandCoffee.Auth}
      - JwtSettings__Audience=${JWT_AUDIENCE:-LowLandCoffee.Clients}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS:-24}
    ports:
      - "${ENGAGEMENT_HOST_PORT:-5004}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - lowland-network

  notification-api:
    build:
      context: .
      dockerfile: src/backend/services/Notification.API/Dockerfile
    container_name: lowland-notification-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__NotificationConnection=Server=${DB_SERVER:-sqlserver},1433;Database=Coffee_NotificationDB;User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-YourPassword123!};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-LowLandCoffee_Super_Secret_Key_For_PRN232_Assignment_2026_Key}
      - JwtSettings__Issuer=${JWT_ISSUER:-LowLandCoffee.Auth}
      - JwtSettings__Audience=${JWT_AUDIENCE:-LowLandCoffee.Clients}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS:-24}
    ports:
      - "${NOTIFICATION_HOST_PORT:-5005}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - lowland-network

  # =========================================================================
  # 4. API Gateway: YARP (Yet Another Reverse Proxy)
  # =========================================================================
  api-gateway:
    build:
      context: .
      dockerfile: src/backend/gateways/ApiGateway/Dockerfile
    container_name: lowland-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=8080
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-LowLandCoffee_Super_Secret_Key_For_PRN232_Assignment_2026_Key}
      - JwtSettings__Issuer=${JWT_ISSUER:-LowLandCoffee.Auth}
      - JwtSettings__Audience=${JWT_AUDIENCE:-LowLandCoffee.Clients}
      - ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address=http://auth-api:8080
      - ReverseProxy__Clusters__product-cluster__Destinations__destination1__Address=http://product-api:8080
      - ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address=http://order-api:8080
      - ReverseProxy__Clusters__engagement-cluster__Destinations__destination1__Address=http://engagement-api:8080
      - ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address=http://notification-api:8080
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      - auth-api
      - product-api
      - order-api
      - engagement-api
      - notification-api
    networks:
      - lowland-network

  # =========================================================================
  # 5. Frontend: ASP.NET Core Razor Pages Web Application
  # =========================================================================
  web-frontend:
    build:
      context: .
      dockerfile: src/frontend/CoffeeShop.WebRazorPages/Dockerfile
    container_name: lowland-web-frontend
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=8080
      - ApiGateway__BaseUrl=http://api-gateway:8080
    ports:
      - "${WEB_HOST_PORT:-5000}:8080"
    depends_on:
      - api-gateway
    networks:
      - lowland-network

# =========================================================================
# Networks & Volumes
# =========================================================================
networks:
  lowland-network:
    name: lowland-network
    driver: bridge

volumes:
  sqlserver-data:
    name: lowland-sqlserver-data
    driver: local
